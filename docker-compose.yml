services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: serein-postgres
    environment:
      POSTGRES_USER: serein
      POSTGRES_PASSWORD: serein_dev_password
      POSTGRES_DB: serein
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U serein"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - serein-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: serein-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - serein-network

  # Redis Exporter (Prometheus)
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: serein-redis-exporter
    environment:
      - REDIS_ADDR=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - serein-network

  # Weaviate Vector Database
  weaviate:
    image: semitechnologies/weaviate:latest
    container_name: serein-weaviate
    ports:
      - "8080:8080"
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      DEFAULT_VECTORIZER_MODULE: 'none'
      ENABLE_MODULES: 'text2vec-openai,text2vec-cohere,text2vec-huggingface'
      CLUSTER_HOSTNAME: 'node1'
    volumes:
      - weaviate_data:/var/lib/weaviate
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/v1/.well-known/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - serein-network

  # PostgreSQL Exporter (Prometheus)
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: serein-postgres-exporter
    environment:
      - DATA_SOURCE_NAME=postgresql://serein:serein_dev_password@postgres:5432/postgres?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - serein-network

  # Ollama (LLM Open Source)
  ollama:
    image: ollama/ollama:latest
    container_name: serein-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_PULL_MODELS=${OLLAMA_PULL_MODELS:-phi}
    entrypoint: ["/bin/sh"]
    command:
      - "-c"
      - "set -e; ollama serve & server_pid=$$!; i=0; until ollama list >/dev/null 2>&1; do i=$$((i+1)); if [ $$i -ge 60 ]; then echo \"Ollama failed to start\"; exit 1; fi; sleep 1; done; for model in $$(echo $${OLLAMA_PULL_MODELS:-phi} | tr ',' ' '); do echo \"Pulling model: $$model\"; ollama pull $$model; done; wait $$server_pid"
    # Uncomment if you have GPU support
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - serein-network

  # Coqui TTS (Text-to-Speech)
  coqui-tts:
    build:
      context: ./services/voice-service/coqui-tts
      dockerfile: Dockerfile
    container_name: serein-coqui-tts
    ports:
      - "5002:5002"
    volumes:
      - coqui_tts_models:/app/models
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5002/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - serein-network

  # Whisper (Speech-to-Text)
  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    container_name: serein-whisper
    ports:
      - "9000:9000"
    environment:
      - ASR_MODEL=${WHISPER_MODEL:-base}
      - ASR_ENGINE=${WHISPER_ENGINE:-openai_whisper}
    # Uncomment if you have GPU support
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:9000/docs')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - serein-network

  # Voice Service
  voice-service:
    build:
      context: .
      dockerfile: services/voice-service/Dockerfile
    container_name: serein-voice-service
    ports:
      - "3006:3006"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - PORT=3006
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:5173}
      - COQUI_TTS_URL=${COQUI_TTS_URL:-http://coqui-tts:5002}
      - COQUI_TTS_DEFAULT_VOICE=${COQUI_TTS_DEFAULT_VOICE:-tts_models/en/ljspeech/tacotron2-DDC}
      - WHISPER_URL=${WHISPER_URL:-http://whisper:9000}
      - WHISPER_MODEL=${WHISPER_MODEL:-base}
    depends_on:
      coqui-tts:
        condition: service_healthy
      whisper:
        condition: service_healthy
    networks:
      - serein-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3006/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Auth Service
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: serein-auth-service
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - PORT=3001
      - AUTH_DATABASE_URL=postgresql://serein:serein_dev_password@postgres:5432/serein_auth
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-15m}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN:-7d}
      - SESSION_TIMEOUT_MS=${SESSION_TIMEOUT_MS:-3600000}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:5173}
      - USER_SERVICE_URL=http://user-service:3002
      - CONVERSATION_SERVICE_URL=http://conversation-service:3003
      - INTERNAL_EVENT_SECRET=${INTERNAL_EVENT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - serein-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # User Service
  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    container_name: serein-user-service
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - PORT=3002
      - USER_DATABASE_URL=postgresql://serein:serein_dev_password@postgres:5432/serein_user
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:5173}
      - INTERNAL_EVENT_SECRET=${INTERNAL_EVENT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - serein-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Conversation Service
  conversation-service:
    build:
      context: .
      dockerfile: services/conversation-service/Dockerfile
    container_name: serein-conversation-service
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - PORT=3003
      - CONVERSATION_DATABASE_URL=postgresql://serein:serein_dev_password@postgres:5432/serein_conversation
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:5173}
      - INTERNAL_EVENT_SECRET=${INTERNAL_EVENT_SECRET:-}
      - AI_SERVICE_URL=${AI_SERVICE_URL:-http://ai-service:3004}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - serein-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3003/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # AI Service
  ai-service:
    build:
      context: .
      dockerfile: services/ai-service/Dockerfile
    container_name: serein-ai-service
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - PORT=3004
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:5173}
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_DEFAULT_MODEL=phi
      - OLLAMA_LIGHT_MODELS=phi
      - OLLAMA_HEAVY_MODELS=${OLLAMA_HEAVY_MODELS:-phi}
      - AI_DOMAIN_STRICT=${AI_DOMAIN_STRICT:-true}
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - serein-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3004/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Content Service
  content-service:
    build:
      context: .
      dockerfile: services/content-service/Dockerfile
    container_name: serein-content-service
    ports:
      - "3005:3005"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - PORT=3005
      - CONTENT_DATABASE_URL=postgresql://serein:serein_dev_password@postgres:5432/serein_content
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:5173}
      - WEAVIATE_URL=${WEAVIATE_URL:-http://weaviate:8080}
      - WEAVIATE_API_KEY=${WEAVIATE_API_KEY:-}
      - WEAVIATE_SCHEMA_CLASS=${WEAVIATE_SCHEMA_CLASS:-Book}
    depends_on:
      postgres:
        condition: service_healthy
      weaviate:
        condition: service_healthy
    networks:
      - serein-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3005/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx (API Gateway)
  nginx:
    image: nginx:alpine
    container_name: serein-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - postgres
      - redis
      - weaviate
      - frontend-web
      - auth-service
      - user-service
      - conversation-service
      - ai-service
      - content-service
      - voice-service
    networks:
      - serein-network

  # Frontend (Web)
  frontend-web:
    build:
      context: .
      dockerfile: frontend/web/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:5173
    container_name: serein-frontend-web
    ports:
      - "5173:3000"
    networks:
      - serein-network

  # Prometheus (Monitoring)
  prometheus:
    image: prom/prometheus:latest
    container_name: serein-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - serein-network

  # Grafana (Visualization)
  grafana:
    image: grafana/grafana:latest
    container_name: serein-grafana
    ports:
      - "3301:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infrastructure/monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    networks:
      - serein-network

  # Loki (Logging)
  loki:
    image: grafana/loki:latest
    container_name: serein-loki
    ports:
      - "3100:3100"
    volumes:
      - ./infrastructure/monitoring/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - serein-network

  # Promtail (Log Collector)
  promtail:
    image: grafana/promtail:latest
    container_name: serein-promtail
    volumes:
      - ./infrastructure/monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - serein-network

volumes:
  postgres_data:
  redis_data:
  weaviate_data:
  ollama_data:
  coqui_tts_models:
  whisper_models:
  prometheus_data:
  grafana_data:
  loki_data:

networks:
  serein-network:
    driver: bridge

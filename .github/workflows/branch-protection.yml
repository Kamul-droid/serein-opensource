name: Branch Protection Check

on:
  push:
    branches: [main, develop]

jobs:
  check-direct-push:
    name: Check for Direct Push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect direct push
        id: detect-push
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          COMMIT_MSG=$(git log -1 --pretty=%B)
          
          # Vérifier si c'est un merge commit (venant d'une PR)
          if echo "$COMMIT_MSG" | grep -qE "^(Merge pull request|Merge branch)"; then
            echo "✅ Commit détecté comme merge (PR ou merge normal)"
            echo "is_merge=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Vérifier si c'est un commit de release/hotfix (peut être autorisé)
          if echo "$COMMIT_MSG" | grep -qE "^(chore|release|hotfix)"; then
            echo "⚠️ Commit de type release/hotfix détecté"
            echo "is_merge=false" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Sinon, c'est probablement un push direct
          echo "❌ Push direct détecté sur $BRANCH_NAME"
          echo "is_merge=false" >> $GITHUB_OUTPUT
          echo "is_release=false" >> $GITHUB_OUTPUT

      - name: Warn about direct push
        if: steps.detect-push.outputs.is_merge != 'true' && steps.detect-push.outputs.is_release != 'true'
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          echo "::warning::Push direct détecté sur $BRANCH_NAME"
          echo ""
          echo "⚠️ ATTENTION: Les pushes directs sur les branches protégées sont déconseillés."
          echo ""
          echo "Pour $BRANCH_NAME, veuillez utiliser une Pull Request:"
          echo "  1. Créer une branche: git checkout -b feature/my-changes"
          echo "  2. Pousser la branche: git push origin feature/my-changes"
          echo "  3. Créer une Pull Request sur GitHub"
          echo ""
          echo "Si ce push était intentionnel (hotfix critique), ignorez cet avertissement."
          echo "Sinon, veuillez configurer la protection de branche GitHub pour bloquer les pushes directs."
          echo ""
          echo "📖 Guide: .github/BRANCH-PROTECTION-SETUP.md"

      - name: Display commit info
        run: |
          echo "Branch: ${GITHUB_REF#refs/heads/}"
          echo "Author: ${{ github.event.head_commit.author.name }}"
          echo "Message: ${{ github.event.head_commit.message }}"
          echo "SHA: ${{ github.sha }}"
